name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('{0}-dev', github.ref_name) }}"
          go build -ldflags="-s -w -X github.com/raskrebs/sonar/internal/selfupdate.Version=${VERSION}" -o sonar .
          tar czf sonar_linux_${{ matrix.goarch }}.tar.gz sonar

      - uses: actions/upload-artifact@v4
        with:
          name: sonar_linux_${{ matrix.goarch }}
          path: sonar_linux_${{ matrix.goarch }}.tar.gz

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('{0}-dev', github.ref_name) }}"
          go build -ldflags="-s -w -X github.com/raskrebs/sonar/internal/selfupdate.Version=${VERSION}" -o sonar .
          codesign -s - sonar

      - name: Build Swift tray app
        run: |
          swiftc -O -o sonar-tray tray/SonarTray.swift \
            -target ${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }}-apple-macos13

      - name: Package
        run: |
          tar czf sonar_darwin_${{ matrix.goarch }}.tar.gz sonar sonar-tray

      - uses: actions/upload-artifact@v4
        with:
          name: sonar_darwin_${{ matrix.goarch }}
          path: sonar_darwin_${{ matrix.goarch }}.tar.gz

  build-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('{0}-dev', github.ref_name) }}"
          go build -ldflags="-s -w -X github.com/raskrebs/sonar/internal/selfupdate.Version=${VERSION}" -o sonar.exe .
          zip sonar_windows_${{ matrix.goarch }}.zip sonar.exe

      - uses: actions/upload-artifact@v4
        with:
          name: sonar_windows_${{ matrix.goarch }}
          path: sonar_windows_${{ matrix.goarch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # One checksum file over the six archives, in sha256sum's own format
      # ("<hex>  <name>", two spaces), sorted by filename. The globs cover only
      # the archives, so the file never lists itself, and the count guard fails
      # the release rather than publishing a short list.
      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum sonar_*.tar.gz sonar_*.zip | LC_ALL=C sort -k2 > sonar_checksums.txt
          count=$(wc -l < sonar_checksums.txt)
          if [ "$count" -ne 6 ]; then
            echo "expected 6 archives, sonar_checksums.txt lists $count" >&2
            exit 1
          fi
          cat sonar_checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sonar_*.tar.gz
            sonar_*.zip
            sonar_checksums.txt

  # The relay is the same binary as the CLI, published as a container so it can
  # be self-hosted. It is not part of the GitHub release, so it needs nothing
  # from the build jobs and runs alongside them.
  relay-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU: Dockerfile.relay builds on the runner's own architecture and
      # cross-compiles with GOARCH, so both platforms are two native `go
      # build`s rather than an emulated one.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/raskrebs/sonar-relay:${{ github.ref_name }}
            ghcr.io/raskrebs/sonar-relay:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: raskrebs/homebrew-sonar
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/raskrebs/sonar/releases/download/${TAG}"

          # The release's own sonar_checksums.txt is the single source of
          # truth for these hashes, so the tap cannot disagree with what the
          # release published.
          curl -fsSL -o sonar_checksums.txt "${BASE}/sonar_checksums.txt"

          declare -A SHAS
          for asset in \
            sonar_darwin_arm64.tar.gz \
            sonar_darwin_amd64.tar.gz \
            sonar_linux_arm64.tar.gz \
            sonar_linux_amd64.tar.gz; do
            SHAS[$asset]=$(awk -v a="$asset" '$2 == a {print $1}' sonar_checksums.txt)
            if [ -z "${SHAS[$asset]}" ]; then
              echo "sonar_checksums.txt has no line for ${asset}" >&2
              exit 1
            fi
          done

          FORMULA=tap/Formula/sonar.rb
          python3 - <<EOF
          import re, os
          path = "$FORMULA"
          version = "$VERSION"
          tag = "$TAG"
          shas = {
              "darwin_arm64": "${SHAS[sonar_darwin_arm64.tar.gz]}",
              "darwin_amd64": "${SHAS[sonar_darwin_amd64.tar.gz]}",
              "linux_arm64":  "${SHAS[sonar_linux_arm64.tar.gz]}",
              "linux_amd64":  "${SHAS[sonar_linux_amd64.tar.gz]}",
          }
          src = open(path).read()
          src = re.sub(r'version "[^"]+"', f'version "{version}"', src, count=1)
          for key, sha in shas.items():
              # update url for this arch
              src = re.sub(
                  rf'(sonar_{key}\.tar\.gz")\s*\n(\s*)sha256 "[0-9a-f]+"',
                  rf'\1\n\2sha256 "{sha}"',
                  src,
              )
          # bump tag in all release URLs
          src = re.sub(r'/releases/download/v[^/]+/', f'/releases/download/{tag}/', src)
          open(path, "w").write(src)
          EOF

      - name: Commit and push
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formula changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sonar.rb
          git commit -m "sonar ${TAG}"
          git push origin main
