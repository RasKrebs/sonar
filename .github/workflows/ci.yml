name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & vet (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # A runner has one checkout and one suite, so the leak gate takes the wide
      # net: any `sonar serve` from anywhere under the temp directory, not only
      # the ones this run built. A developer's machine runs several worktrees
      # at once and must not have it.
      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./...
        env:
          SONAR_TESTENV_GATE_ALL: "1"

      - name: Build
        run: go build ./...

      - name: README examples
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: scripts/readme-check.sh

  integration:
    name: Daemon integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # See the note on the build job's test step: on a runner the leak gate
      # may match every daemon under the temp directory, not only this run's.
      - name: Integration tests
        run: go test -tags integration -timeout 10m ./internal/daemon/...
        env:
          SONAR_TESTENV_GATE_ALL: "1"

      # The relay ships in the same binary, so a change that breaks
      # `sonar relay serve` has to fail here rather than at tag time.
      - name: Relay integration tests
        run: go test -tags integration -timeout 10m ./internal/relay/...
        env:
          SONAR_TESTENV_GATE_ALL: "1"

  schema:
    name: Protocol schema up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate protocol schema
        run: go generate ./... && git diff --exit-code docs/schema

  relay-image:
    name: Relay image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only, never push: the release workflow owns publishing. This is
      # here so a broken Dockerfile.relay fails a pull request instead of a tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
